<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Image Page</title>

    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        img {
            width: 300px;
            height: auto;
            border: 3px solid black;
            margin: 20px;
        }

        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <!-- heading tag -->
    <h1>Welcome to My Web Page</h1>

    <!-- paragraph tag -->
    <p>This page contains an image and a table using HTML tags.</p>

    
    <img src="" alt="">

    <!-- horizontal line -->
    <hr>

    <!-- table -->
    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Kishan</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Rahul</td>
            <td>CSS</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Aman</td>
            <td>JavaScript</td>
        </tr>
    </table>

    <!-- footer -->
    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
